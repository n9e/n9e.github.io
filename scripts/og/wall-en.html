<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  html,body { margin:0; padding:0; background:#fff; overflow:hidden; }
  /* flex 而不是 grid：最后一行不满时居中，看起来是刻意排布而不是缺角 */
  .wrap { display:flex; flex-wrap:wrap; justify-content:center; width:1753.68px; }
  .cell { width:292.28px; height:164.4px; display:grid; place-items:center; }
  .card { width:263px; height:138px; border-radius:14px; background:#fff;
          box-shadow:0 1px 2px rgba(20,18,28,.06), 0 6px 18px -6px rgba(20,18,28,.16);
          display:grid; place-items:center; padding:16px 24px; box-sizing:border-box; }
  .card img { max-width:100%; max-height:52px; object-fit:contain; display:block; }
  /* 官方只提供纯白单色版的，反相成黑色才能放在白卡上 */
  .card img.inv { filter: invert(1); }
</style></head><body>
<div class="wrap" id="w"></div>
<script>
  // 全部为各公司纯英文/国际版标识，逐张光栅化确认无汉字；素材自托管于 scripts/og/logos-en/
  // 第二个元素为 true 表示原图是纯白填充，需反相
  const LOGOS = [
    ['nio.svg'], ['lenovo.svg'], ['tcl.png'], ['hikvision.svg'], ['dji.svg'], ['hisense.svg'],
    ['hoyoverse.svg'], ['tuya.png'], ['liauto.svg'], ['dahua.svg'], ['shein.svg'], ['insta360.svg'],
    ['ponyai.png'], ['dhgate.svg'], ['momenta.png'], ['chery.svg'], ['smart.svg'], ['leapmotor.svg'],
    ['yoshinoya.svg'], ['lotus.svg'], ['inspur.svg'], ['transsion.svg'], ['arcfox.svg'], ['voyah.svg', true],
    ['lilith.png'], ['hypergryph.svg', true], ['sunborn.png', true], ['classin.svg'], ['bespin.svg'],
    ['transfar.png'],
  ];
  const w = document.getElementById('w');
  for (const [file, invert] of LOGOS) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.src = 'logos-en/' + file;
    if (invert) img.className = 'inv';
    card.appendChild(img);
    cell.appendChild(card);
    w.appendChild(cell);
  }
</script>
</body></html>
